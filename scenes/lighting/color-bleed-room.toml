[scene]
asset = "../../assets/ColorBleedRoom.gltf"
environment = [0, 0, 0]

[camera]
auto_frame = false
position = [0, 1, 3.8]
target = [0, 1, 0]
vertical_fov_degrees = 38

[[lighting.lights]]
type = "rectangle"
center = [0, 1.95, 0]
width = 0.96
height = 0.8
power = 20
shadows = true

[render]
mode = "path"
width = 192
height = 192
path_samples = 256
light_samples = 32
max_bounces = 3
seed = 7

[display]
tone_mapping = "reinhard"
