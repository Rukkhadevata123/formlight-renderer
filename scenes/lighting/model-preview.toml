# Open Model keeps this lighting and frames the new asset.
[scene]
asset = "../../assets/MaskPanel.glb"
ground = true

[camera]
auto_frame = true

[render]
mode = "raster"
width = 800
height = 600
ssaa = 2
light_samples = 4
seed = 7

[display]
tone_mapping = "reinhard"
exposure_ev = 0

[lighting]
ambient = [0.18, 0.18, 0.18]

# The directional lights work across models of different sizes.
[[lighting.lights]]
type = "directional"
toward_light = [-2.5, 3.5, 4]
color = [1.0, 0.96, 0.90]
intensity = 3.2
shadows = true
pcf = true

[[lighting.lights]]
type = "directional"
toward_light = [3, 1.5, -2.5]
color = [0.85, 0.92, 1.0]
intensity = 1.4
shadows = false

# These accents are in world units. Enable their shadows in hybrid mode.
[[lighting.lights]]
type = "point"
position = [-2, 1.5, 2]
color = [0.85, 0.92, 1.0]
intensity = 1.8
attenuation = [1, 0.25, 0.35]
shadows = false

[[lighting.lights]]
type = "rectangle"
center = [1, 3, -1]
width = 2
height = 2
power = 14
shadows = false
